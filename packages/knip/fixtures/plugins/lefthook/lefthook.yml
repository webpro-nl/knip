post-merge:
  commands:
    example:
      glob: .env.example
      run: node example.mjs

pre-push:
  commands:
    format:
      root: packages/app/
      run: npx --no prettier --check .
    eslint:
      files: git diff --name-only HEAD @{push}
      glob: '*.{ts,tsx}'
      run: npx --no eslint {files}
