name: CI

on: push

jobs:
  stylelint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run stylelint check
        run: yarn stylelint
        working-directory: packages/app
      - name: Generate icons
        run: yarn icons
        working-directory: packages/app
