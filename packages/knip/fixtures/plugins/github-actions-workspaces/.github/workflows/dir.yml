name: CI

on: push

jobs:
  stylelint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run stylelint check
        run: yarn stylelint
        working-directory: packages/app
      - name: Generate icons
        run: yarn icons
        working-directory: packages/app
      - name: Build site
        run: node_modules/.bin/site-build
        working-directory: packages/lib
      - name: Start app with hook
        run: node -r ./missing-hook.js
        working-directory: packages/app
      - name: Start app with instrumentation
        run: tsx --import=@/instrumentation
        working-directory: packages/app
