[tools]
node = "24"

[tasks]
lint = "time -p npx --no-install eslint ."

[tasks.test]
run = "! npm exec -- vitest run"

[tasks.build]
run = [
  { task = "lint" },
  { tasks = ["test", "format"] },
  "{ yarn exec assets build; } >build.log",
]
run_windows = "pnpm exec windows-checker"

[tasks.ci]
description = "unused-package"
depends = ["build"]
sources = ["scripts/unused.ts"]
outputs = ["dist/unused.ts"]
